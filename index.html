<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="home.title">吉他训练</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="home-screen" class="screen active home">
    <div class="top-bar">
      <span class="home-brand">Aug Guitar</span>
      <div class="lang-switch">
        <select id="lang-select" data-i18n-aria="settings.language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <h1 data-i18n="home.title">吉他训练</h1>
    <p class="subtitle" data-i18n="home.subtitle">选择一个功能开始练习</p>

    <div class="home-section-label" data-i18n="home.section">功能</div>

    <div class="feature-grid">
      <a class="card feature-card" href="trainer.html">
        <div class="feature-title" data-i18n="home.trainer">和弦切换训练器</div>
        <div class="feature-desc" data-i18n="home.trainerDesc">5 分钟和弦切换训练 · Open Chords 与 CAGED · 全指板移调</div>
        <div class="feature-enter" data-i18n="home.enter">进入</div>
      </a>

      <a class="card feature-card" href="chords.html">
        <div class="feature-title" data-i18n="home.chordChart">全量和弦图</div>
        <div class="feature-desc" data-i18n="home.chordChartDesc">CAGED 全性质 × 12 根音 · 全指板指形总表</div>
        <div class="feature-enter" data-i18n="home.enter">进入</div>
      </a>

      <div class="card feature-card disabled">
        <div class="feature-title" data-i18n="home.comingSoon">更多功能即将到来</div>
      </div>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script>
    I18n.load(I18n.initialLocale()).then(function () {
      I18n.apply();
      I18n.initSwitcher('lang-select');
    });
  </script>
</body>
</html>
